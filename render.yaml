services:
  - type: web
    name: zimdeskai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: VERIFY_TOKEN
        value: zimdesk_verify_123
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: BASE_URL
        sync: false
